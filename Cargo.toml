[workspace]
resolver = "2"
members = [
    "crates/lse-core",
    "crates/lse-daemon",
    "crates/lse-bench",
    "crates/lse-cli",
    "crates/lse-gui",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
authors = ["lse contributors"]
license = "MIT"
repository = "https://example.invalid/lse"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8.2"
zbus = { version = "4.2" }
futures-lite = "2.6"
libc = "0.2"
regex = "1"
gtk4 = "0.11"
libadwaita = "0.9"

# 构建限并发，避免本机卡顿
[profile.dev]
debug = 1

[profile.release]
opt-level = 3
codegen-units = 4
lto = "thin"
